[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "codeguards-mcp"
version = "0.1.0"
description = "Code governance MCP server — guardrails for any AI agent"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "starlette",
    "uvicorn",
]
