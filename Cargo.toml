[package]
name = "codeguards-mcp"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
default-run = "codeguards-mcp"

[[bin]]
name = "codeguards-mcp"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
ignore = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v4"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
