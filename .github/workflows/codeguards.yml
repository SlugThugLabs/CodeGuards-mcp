name: CI

# Replaces the previous workflow, which ran `pip install` + `python -m pytest`
# against a repository whose tests are all Rust (`tests/*.rs`, zero `.py`).
# That job exercised nothing. These steps run the code that actually exists.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Backstop: push-triggered runs have never fired on this repository (see the
  # note below), so the gate also runs daily regardless of how code arrived.
  schedule:
    - cron: '17 9 * * *'

# Push events do not appear to trigger workflow runs here — the workflow is
# active, the repo is not a fork, Actions is enabled and the trigger matches
# master. Until that is explained, treat this file as a backstop and rely on the
# local pre-commit hook (`.planning/ARCHITECTURE.md`: "Git pre-commit hook runs
# `codeguards-mcp check --diff`") as the enforcement point that cannot be skipped.

env:
  CARGO_TERM_COLOR: always

# Supersede in-flight runs when the same branch is pushed again, so a fast
# follow-up commit doesn't wait behind a stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # The crate denies pedantic + unwrap_used + expect_used + panic in
      # Cargo.toml, and clippy.toml allows those in tests, where a panic is the
      # assertion mechanism. `-D warnings` also promotes the crate's own
      # `missing_errors_doc` / `missing_panics_doc` warnings to failures.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
